name: Build, test and publish machinepay

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [ develop ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Bootstrap vcpkg
        run: |
          ./external/vcpkg/bootstrap-vcpkg.sh
          echo "$PWD/external/vcpkg" >> "$GITHUB_PATH"

      # Restore vcpkg cache (keyed to manifests so it updates when deps change)
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
            external/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json', '**/vcpkg-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install vcpkg packages
        env:
          VCPKG_FEATURE_FLAGS: manifests
        run: |
          vcpkg install

      - name: Configure (CMake)
        env:
          VCPKG_FEATURE_FLAGS: manifests
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=external/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS=manifests

      - name: Build
        run: cmake --build build --config Debug -j 2

      - name: Run tests
        run: build/mptest

      # Save cache only if we didn't hit it (prevents save conflicts)
      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg
            external/vcpkg/installed
            external/vcpkg/downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Upload executables as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: machinepay-executables
          path: |
            build/machinepay
            build/mptest

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/machinepay
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha

      - name: Build and push Docker image (machinepay)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
