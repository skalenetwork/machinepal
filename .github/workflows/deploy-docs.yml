name: Deploy Docusaurus Docs

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: docs
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

        working-directory: docs
        run: npm run build

      - name: Build Docusaurus site
      - name: Deploy to GitHub Pages
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx docusaurus deploy

      - name: Verify deployed site is reachable
        run: |
          echo "🔍 Checking if site is live..."
          # The base URL is derived from your repo name and owner.
          # Example: https://<owner>.github.io/<repo>/
          DEPLOY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Testing $DEPLOY_URL ..."
          sleep 20  # Wait a few seconds for GitHub Pages to update
          curl -sSfL "$DEPLOY_URL" | grep -q "html" && \
            echo "✅ Site is live at $DEPLOY_URL" || \
            (echo "❌ Could not verify site at $DEPLOY_URL" && exit 1)