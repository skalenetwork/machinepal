name: Deploy Docusaurus Docs

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: docs/package.json

      - name: Install dependencies
        working-directory: docs
        run: npm install

      - name: Build Docusaurus site
        working-directory: docs
        run: npm run build

      - name: Deploy to GitHub Pages
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use --yes to skip confirmation and ensure deploy works in CI
          npx docusaurus deploy --yes --git-protocol https

      - name: Verify deployed site is reachable
        run: |
          echo "🔍 Checking if site is live..."
          REPO_NAME=$(basename "${{ github.event.repository.name }}")
          OWNER="${{ github.repository_owner }}"
          DEPLOY_URL="https://${OWNER}.github.io/${REPO_NAME}/"

          echo "Testing $DEPLOY_URL ..."
          sleep 30  # Give GitHub Pages a moment to update

          if curl -sSfL "$DEPLOY_URL" | grep -q "<html"; then
            echo "✅ Site is live at $DEPLOY_URL"
          else
            echo "❌ Could not verify site at $DEPLOY_URL"
            exit 1
          fi
