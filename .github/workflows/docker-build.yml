name: Build and Push Docker Build Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: skalenetwork/machinepal-build

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile_deps
          platforms: linux/amd64
          load: true        # Load image into local Docker daemon instead of pushing
          push: false       # Do not push the unsquashed image
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp

      - name: Squash and Push
        run: |
          # Install docker-squash tool
          pip install docker-squash

          # Squash the temporary image to the final tag
          # This merges all layers into one, significantly reducing size
          docker-squash -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp

          # Push the final squashed image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
