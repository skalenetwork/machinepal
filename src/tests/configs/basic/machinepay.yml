# Machinepay server configuration. May be overridden by environment variables.
server:
  # Enable or disable HTTP. Override: SERVER_ENABLE_HTTP
  enable_http: true
  # Enable or disable HTTPS. Override: SERVER_ENABLE_HTTPS
  enable_https: false
  # Ports for HTTP/HTTPS. Override: SERVER_HTTP_PORT / SERVER_HTTPS_PORT
  http_listen_port: 8080
  https_listen_port: 8443
  # This section sets up TLS for HTTPS SERVER.
  tls:
    # TLS certificate file. Override: SERVER_TLS_CERT_FILE
    cert_file: certs/machinepay.crt
    # TLS key file. Override: SERVER_TLS_KEY_FILE
    key_file: certs/machinepay.key
    # TLS key password file. Override: SERVER_TLS_KEY_PASS_FILE
    key_pass_file: secrets/key_password
    # Optional CA file. Override: SERVER_TLS_CA_FILE. System CA used if not set.
    ca_file: certs/ca.crt

# Optional logging configuration. Default log level is "info" to stderr.
log:
  # Optional Log verbosity level — one of: trace, debug, info, warn, error, fatal
  # Override: LOG_LEVEL Default: info
  level: info
  # Json format for logs. Override: LOG_JSON Default: false
  json: true



facilitator:
  # Facilitator type. Override: FACILITATOR_TYPE
  # Facilitator types:
  # cdp - Coinbase Developer Platform. You need to set base_url and api_key_file.
  # x402 - generic x402-compatible API. You need to set base_url

  type: cdp
  # Facilitator base URL. Override: FACILITATOR_BASE_URL
  base_url: https://api.coinbase.com/v2
    # Facilitator API key file. Override: FACILITATOR_API_KEY_FILE
  api_key_file: secrets/coinbase_api_key
