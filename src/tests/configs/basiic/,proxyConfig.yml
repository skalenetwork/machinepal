network:
  enableHTTP: true
  enableHTTPS: false
  httpListenPort: 8080
  httpsListenPort: 8443

tls:
  certPath: certs/proxy.crt
  keyPath: certs/proxy.key
  keyPassPath: secrets/key_password

facilitator:
  type: coinbase
  baseURL: https://api.coinbase.com/v2
  apiKeyPath: /etc/proxy/secrets/coinbase_api_key